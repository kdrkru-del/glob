<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJL19YBL46"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HJL19YBL46');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Specifications | GLOBERION GROUP B2B Export</title>
  <link rel="icon" type="image/png" href="../assets/logo-mark.png" />
  <link rel="stylesheet" href="../styles.css?v=20260916-b2b-1" />
  <script src="../products-data.js?v=20260916-b2b-1" defer></script>
  <script src="../catalog-engine.js?v=20260916-b2b-1" defer></script>
  <script src="../script.js?v=20260916-b2b-1" defer></script>
</head>
<body data-page="catalog">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html"><img class="brand-logo" src="../assets/logo-mark.png" alt="Globerion Group" /><span class="brand-copy"><span class="brand-title">Globerion Group</span><span class="brand-tagline">Bridging Markets</span></span></a>
      <nav class="nav" id="site-nav">
        <a class="nav-link is-current" href="../products.html">Products</a>
        <a class="nav-link" href="../services.html#product-sourcing">Private Label</a>
        <a class="nav-link" href="../logistics.html">Logistics</a>
        <a class="nav-link" href="../about.html">About Us</a>
        <a class="nav-link" href="../contacts.html">Contact</a>
        <button class="nav-action" type="button" data-open-quote>Request a Quote</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="section" id="dynamic-product-section" style="padding-top: 40px;">
      <div class="container" id="dynamic-product-content">
        <!-- Rendered via JavaScript from products-data.js -->
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      if (!slug && window.GLOBERION_CATALOG && window.GLOBERION_CATALOG.PRODUCTS.length > 0) {
        slug = window.GLOBERION_CATALOG.PRODUCTS[0].slug;
      }
      var product = window.GLOBERION_CATALOG ? window.GLOBERION_CATALOG.getProductBySlug(slug) : null;
      var container = document.getElementById("dynamic-product-content");
      if (!product || !container) return;

      var lang = document.documentElement.lang || "en";
      var name = (product.name && product.name[lang]) || product.name.en || "";
      var desc = (product.description && product.description[lang]) || product.description.en || "";
      var priceText = window.GLOBERION_ENGINE.formatPrice(product, lang);

      var specsRows = (product.specifications || []).map(function(s) {
        var lbl = (s.label && s.label[lang]) || s.label.en || "";
        return '<tr style="border-bottom: 1px solid rgba(16, 32, 29, 0.08);"><td style="padding: 8px 0; color: var(--muted);">' + lbl + '</td><td style="padding: 8px 0; font-weight: 650; text-align: right;">' + s.value + '</td></tr>';
      }).join("");

      document.title = name + " | GLOBERION GROUP B2B Export";

      container.innerHTML =
        '<div class="b2b-breadcrumbs" style="color: var(--muted); margin-bottom: 24px;">' +
          '<a href="../index.html" style="color: var(--ink);">Home</a><span class="separator">/</span>' +
          '<a href="../products.html" style="color: var(--ink);">Products</a><span class="separator">/</span>' +
          '<span class="current" style="color: var(--emerald); font-weight: 700;">' + name + '</span>' +
        '</div>' +
        '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 36px; align-items: start;">' +
          '<div style="position: relative; border-radius: 12px; overflow: hidden; border: 1px solid rgba(16, 32, 29, 0.12); background: var(--white); box-shadow: 0 16px 48px rgba(7, 20, 18, 0.08);">' +
            '<img src="../' + product.image + '" alt="' + name + '" style="width: 100%; aspect-ratio: 4/3; object-fit: cover;" />' +
            '<div style="position: absolute; top: 16px; left: 16px; display: flex; gap: 8px;">' +
              '<span class="product-b2b-badge badge-category">' + product.category + '</span>' +
              '<span class="product-b2b-badge badge-origin">' + product.originShort + '</span>' +
            '</div>' +
          '</div>' +
          '<div style="display: flex; flex-direction: column; gap: 16px;">' +
            '<div>' +
              '<span class="section-kicker" style="color: var(--bronze);">Export Specification</span>' +
              '<h1 style="margin: 6px 0 10px; font-size: 2rem; line-height: 1.25; color: var(--ink);">' + name + '</h1>' +
              '<p style="color: var(--muted); margin: 0; font-size: 0.95rem;">' + desc + '</p>' +
            '</div>' +
            '<div style="display: flex; align-items: center; gap: 20px; padding: 14px 18px; background: var(--porcelain); border-radius: 8px; border: 1px solid rgba(16, 32, 29, 0.08);">' +
              '<div>' +
                '<span style="display: block; font-size: 0.76rem; color: var(--muted); text-transform: uppercase;">Price</span>' +
                '<strong style="font-size: 1.35rem; color: var(--emerald);">' + priceText + '</strong>' +
              '</div>' +
              '<div style="border-left: 1px solid rgba(16, 32, 29, 0.1); padding-left: 20px;">' +
                '<span style="display: block; font-size: 0.76rem; color: var(--muted); text-transform: uppercase;">Minimum Order (MOQ)</span>' +
                '<strong style="font-size: 1.05rem; color: var(--ink);">' + (product.moq || "Contact us") + '</strong>' +
              '</div>' +
            '</div>' +
            '<div style="display: flex; gap: 14px; margin-top: 6px;">' +
              '<button class="btn btn-primary" type="button" data-open-quote data-product-name="' + name + '" style="flex: 1;">Request a Quote</button>' +
              '<a class="btn btn-secondary" href="../products.html" style="flex: 0.7;">View All Products</a>' +
            '</div>' +
            '<div style="margin-top: 14px;">' +
              '<h3 style="font-size: 1.05rem; margin-bottom: 12px; color: var(--ink);">Technical Parameters</h3>' +
              '<table style="width: 100%; border-collapse: collapse; font-size: 0.88rem;"><tbody>' + specsRows + '</tbody></table>' +
            '</div>' +
          '</div>' +
        '</div>';
    });
  </script>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-company">
        <div class="footer-brand-line">
          <img class="footer-logo-mark" src="../assets/logo-mark.png" alt="" />
          <span>© <span data-year></span> GLOBERION GROUP. B2B trade services with Vietnam.</span>
        </div>
      </div>
      <div class="footer-links">
        <a href="../index.html">Home</a><a href="../products.html">Products</a><a href="../about.html">About us</a><a href="../contacts.html">Contacts</a>
      </div>
    </div>
  </footer>
</body>
</html>
